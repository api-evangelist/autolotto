name: AutoLotto
description: >-
  AutoLotto, Inc. operates Lottery.com, a mobile platform that lets users in participating US
  states play official draw lottery games such as Powerball and Mega Millions from their phones,
  track tickets, view winning numbers, jackpot sizes and draw times, and collect winnings to a
  linked bank account. Beyond the consumer app, AutoLotto runs a business data-licensing offering
  that syndicates results and draw data for hundreds of lottery games worldwide to partner digital
  properties. AutoLotto is venture-backed (500 Global, Pantera Capital) and its parent trades
  publicly. As of this enrichment pass Lottery.com exposes no public developer API, OpenAPI
  specification, SDKs, or self-service developer portal; data access is arranged through a manual
  "license our data" inquiry form rather than a programmatic surface.
